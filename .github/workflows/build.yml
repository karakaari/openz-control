name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build
        run: |
          find . -name "settings.gradle*" -not -path "./.git/*"
          F=$(find . -name "settings.gradle.kts" -not -path "./.git/*" | head -1)
          if [ -z "$F" ]; then echo "settings.gradle.kts NOT FOUND in repo"; ls -R | head -50; exit 1; fi
          cd "$(dirname "$F")"
          gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: openz-control-apk
          path: "**/build/outputs/apk/debug/*.apk"
